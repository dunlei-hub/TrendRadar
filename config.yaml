# ================= 基础设置 =================
app:
  timezone: "Asia/Shanghai"
  show_version_update: true

# ================= 调度设置 =================
schedule:
  enabled: true
  preset: "custom"

# ================= 数据源 =================
platforms:
  enabled: true
  sources:
    - id: "zhihu"; name: "知乎"
    - id: "weibo"; name: "微博"
    - id: "douyin"; name: "抖音"
    - id: "bilibili"; name: "B站"

# ================= 筛选策略 =================
filter:
  method: "keyword"
  keywords:
    - "人工智能"
    - "科技"
    - "财经"
    - "AI"

# ================= 通知渠道 =================
notification:
  enabled: true
  channels:
    telegram:
      bot_token: "${TELEGRAM_BOT_TOKEN}"
      chat_id: "${TELEGRAM_CHAT_ID}"
      parse_mode: "Markdown"
      disable_notification: false
